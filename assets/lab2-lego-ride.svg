<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="t2">
  <title id="t2">체험 2: 코딩 블록을 순서대로 실행하면 레고로 만든 관람차가 두 바퀴 돌고, 멈춰서 소리를 내고, 반대로 한 바퀴 도는 모습</title>
  <style>
    text { font-family: "Noto Sans KR", sans-serif; font-weight: 900; }
    .loop { animation-duration: 7s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .wheel { animation-name: spin; transform-box: view-box; transform-origin: 360px 170px; }
    @keyframes spin { 0%, 10% { transform: rotate(0deg); } 45%, 55% { transform: rotate(720deg); } 90%, 100% { transform: rotate(360deg); } }
    .cab { animation-name: keep; transform-box: fill-box; transform-origin: 50% 0%; }
    @keyframes keep { 0%, 10% { transform: rotate(0deg); } 45%, 55% { transform: rotate(-720deg); } 90%, 100% { transform: rotate(-360deg); } }
    .b1 { animation-name: b1; } .b2 { animation-name: b2; } .b3 { animation-name: b3; } .beep { animation-name: b2; }
    @keyframes b1 { 0%, 8% { opacity: 0; } 10%, 44% { opacity: 1; } 46%, 100% { opacity: 0; } }
    @keyframes b2 { 0%, 45% { opacity: 0; } 47%, 54% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @keyframes b3 { 0%, 55% { opacity: 0; } 57%, 89% { opacity: 1; } 91%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .loop { animation: none; } .b1 { opacity: 1; } .b2, .b3, .beep { opacity: 0; } }
  </style>

  <rect x="0" y="0" width="480" height="360" fill="#fafaf8"/>

  <!-- 코딩 블록 -->
  <path d="M30 30 h150 a8 8 0 0 1 8 8 v22 a8 8 0 0 1 -8 8 h-110 l-6 6 h-14 l-6 -6 h-14 a8 8 0 0 1 -8 -8 v-22 a8 8 0 0 1 8 -8 z" fill="#ff542a"/>
  <text x="44" y="55" font-size="15" fill="#fff">시작하기를 누르면</text>
  <path d="M30 74 h20 l6 6 h14 l6 -6 h104 a8 8 0 0 1 8 8 v24 a8 8 0 0 1 -8 8 h-104 l-6 6 h-14 l-6 -6 h-20 a8 8 0 0 1 -8 -8 v-24 a8 8 0 0 1 8 -8 z" fill="#171717"/>
  <rect class="b1 loop" x="22" y="74" width="166" height="40" rx="8" fill="none" stroke="#ff542a" stroke-width="4"/>
  <text x="44" y="100" font-size="15" fill="#fff">2바퀴 돌기</text>
  <path d="M30 118 h20 l6 6 h14 l6 -6 h104 a8 8 0 0 1 8 8 v24 a8 8 0 0 1 -8 8 h-104 l-6 6 h-14 l-6 -6 h-20 a8 8 0 0 1 -8 -8 v-24 a8 8 0 0 1 8 -8 z" fill="#5a5a5a"/>
  <rect class="b2 loop" x="22" y="118" width="166" height="40" rx="8" fill="none" stroke="#ff542a" stroke-width="4"/>
  <text x="44" y="144" font-size="15" fill="#fff">멈추고 삐 소리</text>
  <path d="M30 162 h20 l6 6 h14 l6 -6 h104 a8 8 0 0 1 8 8 v24 a8 8 0 0 1 -8 8 h-150 a8 8 0 0 1 -8 -8 v-24 a8 8 0 0 1 8 -8 z" fill="#171717"/>
  <rect class="b3 loop" x="22" y="162" width="166" height="40" rx="8" fill="none" stroke="#ff542a" stroke-width="4"/>
  <text x="44" y="188" font-size="15" fill="#fff">반대로 1바퀴 돌기</text>

  <rect x="22" y="226" width="186" height="54" rx="6" fill="#fff" stroke="#e2e1dc" stroke-width="2"/>
  <text x="115" y="249" font-size="14" fill="#171717" text-anchor="middle">블록을 끼운 순서대로</text>
  <text x="115" y="268" font-size="14" fill="#171717" text-anchor="middle">관람차가 움직여요</text>

  <!-- 레고 바닥판 -->
  <rect x="0" y="306" width="480" height="54" fill="#ecebe6"/>
  <g fill="#dedcd5">
    <rect x="12" y="298" width="20" height="10" rx="3"/><rect x="52" y="298" width="20" height="10" rx="3"/><rect x="92" y="298" width="20" height="10" rx="3"/><rect x="132" y="298" width="20" height="10" rx="3"/><rect x="172" y="298" width="20" height="10" rx="3"/><rect x="212" y="298" width="20" height="10" rx="3"/><rect x="252" y="298" width="20" height="10" rx="3"/><rect x="452" y="298" width="20" height="10" rx="3"/>
  </g>

  <!-- 관람차 다리와 받침 블록 -->
  <path d="M360 170 L300 286 M360 170 L420 286" stroke="#3a3a3a" stroke-width="12" stroke-linecap="square"/>
  <rect x="282" y="284" width="156" height="22" rx="3" fill="#171717"/>
  <g fill="#3a3a3a">
    <rect x="292" y="277" width="18" height="8" rx="2"/><rect x="322" y="277" width="18" height="8" rx="2"/><rect x="352" y="277" width="18" height="8" rx="2"/><rect x="382" y="277" width="18" height="8" rx="2"/><rect x="412" y="277" width="18" height="8" rx="2"/>
  </g>

  <!-- 바퀴: 테와 바큇살이 돌고, 객차는 반대로 돌아 늘 아래를 향한다 -->
  <g class="wheel loop">
    <circle cx="360" cy="170" r="90" fill="none" stroke="#171717" stroke-width="8"/>
    <circle cx="360" cy="170" r="58" fill="none" stroke="#d6d4cd" stroke-width="3"/>
    <g stroke="#171717" stroke-width="4">
      <line x1="360" y1="170" x2="450" y2="170"/><line x1="360" y1="170" x2="405" y2="248"/><line x1="360" y1="170" x2="315" y2="248"/>
      <line x1="360" y1="170" x2="270" y2="170"/><line x1="360" y1="170" x2="315" y2="92"/><line x1="360" y1="170" x2="405" y2="92"/>
    </g>
    <g class="cab loop"><line x1="450" y1="170" x2="450" y2="177" stroke="#171717" stroke-width="3"/><rect x="436" y="176" width="28" height="20" rx="3" fill="#ff542a"/><rect x="441" y="180" width="18" height="7" rx="1" fill="#fff" opacity="0.85"/></g>
    <g class="cab loop"><line x1="405" y1="248" x2="405" y2="255" stroke="#171717" stroke-width="3"/><rect x="391" y="254" width="28" height="20" rx="3" fill="#fff" stroke="#171717" stroke-width="2"/><rect x="396" y="258" width="18" height="7" rx="1" fill="#ff542a" opacity="0.85"/></g>
    <g class="cab loop"><line x1="315" y1="248" x2="315" y2="255" stroke="#171717" stroke-width="3"/><rect x="301" y="254" width="28" height="20" rx="3" fill="#9a9a9a"/><rect x="306" y="258" width="18" height="7" rx="1" fill="#fff" opacity="0.85"/></g>
    <g class="cab loop"><line x1="270" y1="170" x2="270" y2="177" stroke="#171717" stroke-width="3"/><rect x="256" y="176" width="28" height="20" rx="3" fill="#ff542a"/><rect x="261" y="180" width="18" height="7" rx="1" fill="#fff" opacity="0.85"/></g>
    <g class="cab loop"><line x1="315" y1="92" x2="315" y2="99" stroke="#171717" stroke-width="3"/><rect x="301" y="98" width="28" height="20" rx="3" fill="#fff" stroke="#171717" stroke-width="2"/><rect x="306" y="102" width="18" height="7" rx="1" fill="#ff542a" opacity="0.85"/></g>
    <g class="cab loop"><line x1="405" y1="92" x2="405" y2="99" stroke="#171717" stroke-width="3"/><rect x="391" y="98" width="28" height="20" rx="3" fill="#9a9a9a"/><rect x="396" y="102" width="18" height="7" rx="1" fill="#fff" opacity="0.85"/></g>
  </g>
  <!-- 모터 축 -->
  <circle cx="360" cy="170" r="15" fill="#ff542a"/>
  <circle cx="360" cy="170" r="5" fill="#fff"/>

  <!-- 멈추면 삐! -->
  <g class="beep loop">
    <rect x="404" y="24" width="58" height="30" rx="15" fill="#ff542a"/>
    <text x="433" y="45" font-size="15" fill="#fff" text-anchor="middle">삐!</text>
  </g>
</svg>
