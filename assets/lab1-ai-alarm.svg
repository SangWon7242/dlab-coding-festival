<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="t1">
  <title id="t1">체험 1: 보호자가 매트에 누우면 카메라 AI가 쓰러짐을 알아채고, 아두이노 보드의 경고등과 부저가 울리는 모습</title>
  <style>
    text { font-family: "Noto Sans KR", sans-serif; font-weight: 900; }
    .loop { animation-duration: 6s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    /* 0~25% 서 있음 → 25~35% 눕기 → 35~85% 누워 있음(50%부터 경보) → 85~95% 일어나기 */
    .person { transform-origin: 332px 268px; transform-box: view-box; animation-name: fall; }
    @keyframes fall { 0%, 25% { transform: rotate(0); } 35%, 85% { transform: rotate(90deg); } 95%, 100% { transform: rotate(0); } }
    .tag-stand { animation-name: tagStand; }
    .tag-fall { animation-name: tagFall; }
    @keyframes tagStand { 0%, 30% { opacity: 1; } 34%, 88% { opacity: 0; } 92%, 100% { opacity: 1; } }
    @keyframes tagFall { 0%, 30% { opacity: 0; } 34%, 88% { opacity: 1; } 92%, 100% { opacity: 0; } }
    .mini { transform-origin: 106px 118px; animation-name: miniFall; }
    @keyframes miniFall { 0%, 25% { transform: rotate(0); } 35%, 85% { transform: rotate(-90deg); } 95%, 100% { transform: rotate(0); } }
    .timer { animation-name: timer; transform-origin: 0 0; }
    @keyframes timer { 0%, 35% { transform: scaleX(0); } 50%, 85% { transform: scaleX(1); } 88%, 100% { transform: scaleX(0); } }
    .alarm { animation-name: alarm; }
    @keyframes alarm { 0%, 49% { opacity: 0; } 50%, 54%, 60%, 66%, 72%, 78%, 84% { opacity: 1; } 57%, 63%, 69%, 75%, 81% { opacity: 0.15; } 86%, 100% { opacity: 0; } }
    .wave { animation-name: wave; }
    @keyframes wave { 0%, 49% { opacity: 0; transform: scale(0.6); } 55%, 84% { opacity: 1; transform: scale(1); } 86%, 100% { opacity: 0; } }
    .wave { transform-origin: 300px 300px; transform-box: view-box; }
    @media (prefers-reduced-motion: reduce) { .loop { animation: none; } .tag-fall, .alarm, .wave { opacity: 1; } .tag-stand { opacity: 0; } }
  </style>

  <!-- 바닥 -->
  <rect x="0" y="0" width="480" height="360" fill="#fafaf8"/>
  <rect x="0" y="268" width="480" height="92" fill="#ecebe6"/>
  <rect x="300" y="262" width="164" height="14" rx="4" fill="#ffb39f"/>

  <!-- 노트북: 카메라 AI 화면 -->
  <g>
    <rect x="30" y="40" width="168" height="118" rx="10" fill="#1b2a4a"/>
    <rect x="40" y="50" width="148" height="98" rx="4" fill="#0f1a33"/>
    <circle cx="114" cy="45" r="3" fill="#7cf0a0"/>
    <!-- 화면 속 사람 -->
    <g class="mini loop">
      <rect x="98" y="72" width="16" height="16" rx="3" fill="#ffd34d"/>
      <rect x="96" y="89" width="20" height="18" rx="2" fill="#ff7a3d"/>
      <rect x="98" y="107" width="16" height="11" fill="#3b7d4e"/>
    </g>
    <rect x="60" y="64" width="92" height="70" fill="none" stroke="#7cf0a0" stroke-width="2" stroke-dasharray="6 4"/>
    <!-- 인식 결과 -->
    <g class="tag-stand loop"><rect x="44" y="128" width="78" height="18" rx="9" fill="#2bb673"/><text x="83" y="141" font-size="12" fill="#fff" text-anchor="middle">서 있음 96%</text></g>
    <g class="tag-fall loop"><rect x="44" y="128" width="78" height="18" rx="9" fill="#ff542a"/><text x="83" y="141" font-size="12" fill="#fff" text-anchor="middle">쓰러짐 97%</text></g>
    <path d="M22 158 h184 l-10 14 h-164 z" fill="#2c3d63"/>
  </g>
  <rect x="30" y="182" width="168" height="26" rx="13" fill="#fff"/>
  <text x="114" y="200" font-size="14" fill="#1b2a4a" text-anchor="middle">카메라 AI가 자세를 봐요</text>

  <!-- 3초 타이머 -->
  <g>
    <rect x="232" y="56" width="112" height="44" rx="12" fill="#fff"/>
    <text x="288" y="74" font-size="12" fill="#1b2a4a" text-anchor="middle">쓰러짐이 3초 넘으면</text>
    <rect x="244" y="82" width="88" height="8" rx="4" fill="#e3e8f2"/>
    <rect class="timer loop" x="244" y="82" width="88" height="8" rx="4" fill="#ff542a" style="transform-origin: 244px 86px"/>
  </g>

  <!-- 부모님 (블록 아바타) -->
  <g class="person loop">
    <rect x="316" y="152" width="34" height="32" rx="7" fill="#ffd34d"/>
    <circle cx="326" cy="166" r="3" fill="#1b2a4a"/><circle cx="340" cy="166" r="3" fill="#1b2a4a"/>
    <path d="M326 175 q7 6 14 0" stroke="#1b2a4a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="310" y="186" width="46" height="44" rx="4" fill="#ff7a3d"/>
    <rect x="296" y="188" width="14" height="40" rx="4" fill="#ffd34d"/>
    <rect x="356" y="188" width="14" height="40" rx="4" fill="#ffd34d"/>
    <rect x="312" y="230" width="20" height="38" rx="3" fill="#3b7d4e"/>
    <rect x="334" y="230" width="20" height="38" rx="3" fill="#3b7d4e"/>
  </g>

  <!-- 아두이노 보드 + 경고등 + 부저 -->
  <g>
    <rect x="40" y="250" width="150" height="72" rx="8" fill="#00878f"/>
    <rect x="60" y="262" width="58" height="44" rx="4" fill="#c9ced8"/>
    <rect x="66" y="268" width="46" height="32" rx="2" fill="#aab1bf"/>
    <g fill="#f5c518">
      <rect x="48" y="252" width="6" height="6"/><rect x="58" y="252" width="6" height="6"/><rect x="68" y="252" width="6" height="6"/><rect x="78" y="252" width="6" height="6"/><rect x="88" y="252" width="6" height="6"/><rect x="98" y="252" width="6" height="6"/><rect x="108" y="252" width="6" height="6"/><rect x="118" y="252" width="6" height="6"/><rect x="128" y="252" width="6" height="6"/><rect x="138" y="252" width="6" height="6"/><rect x="148" y="252" width="6" height="6"/><rect x="158" y="252" width="6" height="6"/><rect x="168" y="252" width="6" height="6"/><rect x="178" y="252" width="6" height="6"/>
    </g>
    <text x="150" y="292" font-size="15" fill="#fff" text-anchor="middle">아두이노</text>
  </g>
  <path d="M190 280 C 220 280, 220 230, 252 230" stroke="#ff542a" stroke-width="4" fill="none"/>
  <path d="M190 300 C 230 300, 250 300, 282 300" stroke="#1b2a4a" stroke-width="4" fill="none"/>
  <!-- 경고등 -->
  <circle cx="262" cy="222" r="16" fill="#5a2416"/>
  <circle class="alarm loop" cx="262" cy="222" r="16" fill="#ff542a"/>
  <circle class="alarm loop" cx="262" cy="222" r="28" fill="#ff542a" opacity="0.25"/>
  <!-- 부저 -->
  <circle cx="300" cy="300" r="18" fill="#1b2a4a"/>
  <circle cx="300" cy="300" r="5" fill="#0b1224"/>
  <g class="wave loop" fill="none" stroke="#ff542a" stroke-width="4" stroke-linecap="round">
    <path d="M326 286 q10 14 0 28"/><path d="M338 276 q18 24 0 48"/>
  </g>
  <rect x="196" y="326" width="140" height="24" rx="12" fill="#fff"/>
  <text x="266" y="343" font-size="13" fill="#1b2a4a" text-anchor="middle">경고등과 부저가 울려요</text>
</svg>
